name: Update PHP Scoper

on:
  schedule:
    # Runs at 00:00 UTC every day
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  update-php-scoper:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0 # Fetch all history for all tags and branches

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1' # Set the PHP version to your project's requirement

      # TEST HARNESS - scratch branch only, never merge to main.
      # Forces UPDATED=true so the Create Pull Request and Tag steps below
      # (which are byte-identical to main) actually execute.
      - name: Update PHP Scoper
        id: update
        run: |
          date -u +"harness run at %Y-%m-%dT%H:%M:%SZ" > .github/WORKFLOW-TEST-MARKER
          echo "UPDATED=true" >> "$GITHUB_ENV"
          echo "NEW_VERSION=ci-verify-tmp" >> "$GITHUB_ENV"
          echo "PHP_VERSION=^8.2" >> "$GITHUB_ENV"

      - name: Create Pull Request
        id: cpr
        if: env.UPDATED == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          title: "Update PHP Scoper to ${{ env.NEW_VERSION }}"
          body: |
            - Updated required PHP version to ${{ env.PHP_VERSION }}
            - Downloaded latest release to bin/ folder
          branch: update-php-scoper-${{ env.NEW_VERSION }}

      - name: Tag new version
        if: env.UPDATED == 'true'
        env:
          NEW_VERSION: ${{ env.NEW_VERSION }}
          HEAD_SHA: ${{ steps.cpr.outputs.pull-request-head-sha }}
        run: |
          if git rev-parse -q --verify "refs/tags/$NEW_VERSION" > /dev/null; then
            echo "Tag $NEW_VERSION already exists, nothing to do."
            exit 0
          fi
          git tag "$NEW_VERSION" "$HEAD_SHA"
          git push origin "$NEW_VERSION"
